<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhaka Emergency Finder</title>
<meta name="description" content="Find the hospital, pharmacy, police or fire station in Dhaka that you can reach fastest. Powered by Geoapify.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16191d; --muted: #5d6670; --line: #dfe3e8;
    --accent: #1565c0; --accent-text: #ffffff; --danger: #b00020; --warn-bg: #fff4e5; --warn: #8a4b00;
    --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --card: #1a1f25; --text: #e9edf1; --muted: #9aa5b1; --line: #2b323a;
      --accent: #5aa2f0; --accent-text: #0b1520; --danger: #ff5c6c; --warn-bg: #3a2a12; --warn: #ffc069;
      --chip: #232a32;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", "Noto Sans", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 32px; }
  .call { display: block; text-align: center; background: var(--danger); color: #fff; font-weight: 700;
          padding: 14px; border-radius: 10px; text-decoration: none; font-size: 1.1rem; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; gap: 8px; }
  h1 { font-size: 1.25rem; margin: 0; }
  label.h { display: block; font-weight: 600; margin: 14px 0 6px; }
  .search { display: flex; gap: 8px; }
  .field { position: relative; flex: 1; min-width: 0; display: flex; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--card); color: var(--text); font-size: 1rem; }
  #suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 1100; margin: 4px 0 0; padding: 4px 0;
             list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 6px 18px rgba(0,0,0,.18); max-height: 60vh; overflow-y: auto; }
  #suggest li { padding: 9px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
  #suggest li[aria-selected=true], #suggest li:hover { background: var(--chip); }
  .s-main { font-weight: 600; overflow-wrap: anywhere; }
  .s-sub { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
         padding: 10px 14px; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.small { padding: 6px 10px; font-size: .9rem; }
  .btn.ghost { background: transparent; }
  .myloc { width: 100%; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px;
                  padding: 7px 12px; font-size: .95rem; cursor: pointer; }
  .chips button[aria-pressed=true] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .status { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--chip); }
  .status.error { background: var(--warn-bg); color: var(--warn); }
  #map { height: 300px; border-radius: 10px; margin: 14px 0 6px; border: 1px solid var(--line); }
  .from { color: var(--muted); font-size: .9rem; margin: 10px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; }
  .card.best { border: 2px solid var(--accent); }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row h3 { font-size: 1.02rem; margin: 0; flex: 1; overflow-wrap: anywhere; }
  .rank { background: var(--accent); color: var(--accent-text); border-radius: 999px; min-width: 24px; height: 24px;
          display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; }
  .time { font-weight: 700; white-space: nowrap; }
  .meta, .addr { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .warn { margin: 6px 0 0; color: var(--warn); font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .note { background: var(--chip); padding: 8px 10px; border-radius: 8px; font-size: .92rem; }
  .muted { color: var(--muted); } .small { font-size: .82rem; }
  .pin { background: var(--accent); color: var(--accent-text); border-radius: 999px; text-align: center;
         line-height: 26px; font-weight: 700; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.best { background: var(--danger); color: #fff; }
  #keybox { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px; margin-top: 14px; }
  #keybox form { display: flex; gap: 8px; margin-top: 8px; }
  footer { margin-top: 24px; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <a class="call" href="tel:999" data-t="call">Emergency? Tap to call 999</a>

  <header>
    <h1>Dhaka Emergency Finder</h1>
    <button class="btn ghost small" id="lang" data-t="lang">বাংলা</button>
  </header>

  <div id="keybox" hidden>
    <b data-t="keytitle">Geoapify API key needed</b>
    <p class="small" data-t="keyhelp">This demo needs a free Geoapify API key.</p>
    <a class="small" href="https://myprojects.geoapify.com" target="_blank" rel="noopener">myprojects.geoapify.com</a>
    <form id="keyform"><input type="text" id="keyinput" autocomplete="off" aria-label="API key">
      <button class="btn primary small" data-t="keysave">Save key</button></form>
  </div>

  <label class="h" for="where-input" data-t="where">Where are you?</label>
  <form class="search" id="search">
    <div class="field">
      <input type="text" id="where-input" autocomplete="off" role="combobox" aria-autocomplete="list"
             aria-controls="suggest" aria-expanded="false">
      <ul id="suggest" role="listbox" hidden></ul>
    </div>
    <button class="btn primary" data-t="find">Find fastest</button>
  </form>
  <button class="btn myloc" id="myloc">📍 <span data-t="myloc">Use my location</span></button>

  <label class="h" data-t="what">What do you need?</label>
  <div class="chips" role="group">
    <button data-kind="hospital" aria-pressed="true" data-t="hospital">Hospital</button>
    <button data-kind="pharmacy" aria-pressed="false" data-t="pharmacy">Pharmacy</button>
    <button data-kind="clinic" aria-pressed="false" data-t="clinic">Clinic</button>
    <button data-kind="police" aria-pressed="false" data-t="police">Police</button>
    <button data-kind="fire" aria-pressed="false" data-t="fire">Fire service</button>
    <button data-kind="ambulance" aria-pressed="false" data-t="ambulance">Ambulance</button>
  </div>

  <label class="h" data-t="how">How are you travelling?</label>
  <div class="chips" role="group">
    <button data-mode="drive" aria-pressed="true" data-t="drive">Car</button>
    <button data-mode="motorcycle" aria-pressed="false" data-t="motorcycle">Motorcycle</button>
    <button data-mode="walk" aria-pressed="false" data-t="walk">Walk</button>
  </div>

  <p class="status" id="status" hidden></p>
  <div id="map" hidden></div>
  <section id="results" aria-live="polite"></section>

  <footer>
    Ranked by travel time with approximate traffic. Data © OpenStreetMap contributors, powered by
    <a href="https://www.geoapify.com/">Geoapify</a>. Open source:
    <a href="https://github.com/Abdullah-Atif/dhaka-emergency-finder">GitHub</a> ·
    <a href="../tutorial.html">How it was built</a>
  </footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js?v=20261022"></script>
<script src="config.local.js"></script><!-- optional, git-ignored: local test key -->
<script src="app.js?v=20261022"></script>
</body>
</html>
